<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<title>デモアプリ集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F3F9;
    --surface: #FFFFFF;
    --field: #F1F3F9;
    --ink: #1A1C24;
    --sub: #6B7080;
    --accent: #4C6EF5;
    --on-accent: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --surface: #1C1F26;
      --field: #262A33;
      --ink: #F1F3F9;
      --sub: #9AA0B0;
      --accent: #748FFC;
      --on-accent: #0E1430;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 20px calc(40px + env(safe-area-inset-bottom));
  }
  header { margin-bottom: 28px; }
  h1 {
    margin: 0;
    font-size: clamp(30px, 8vw, 44px);
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: -.01em;
  }
  .lead { margin: 10px 0 0; color: var(--sub); max-width: 34em; }

  .apps {
    display: grid;
    gap: 16px;
  }
  @media (min-width: 680px) {
    .apps { grid-template-columns: 1fr 1fr; }
  }

  a.app {
    display: block;
    background: var(--surface);
    border-radius: 28px;
    padding: 16px 16px 22px;
    color: inherit;
    text-decoration: none;
    transition: transform .15s;
  }
  a.app:active { transform: scale(.98); }
  @media (hover: hover) {
    a.app:hover { transform: translateY(-3px); }
  }

  .thumb {
    aspect-ratio: 4 / 3;
    border-radius: 18px;
    display: grid;
    place-items: center;
    overflow: hidden;
    margin-bottom: 18px;
  }

  /* ルーレットのサムネイル */
  .thumb.roulette { background: var(--field); }
  .mini-wheel {
    position: relative;
    width: 58%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: conic-gradient(
      #4C6EF5 0 60deg, var(--surface) 60deg 61.5deg,
      #FF8787 61.5deg 120deg, var(--surface) 120deg 121.5deg,
      #20C997 121.5deg 180deg, var(--surface) 180deg 181.5deg,
      #FCC419 181.5deg 240deg, var(--surface) 240deg 241.5deg,
      #9775FA 241.5deg 300deg, var(--surface) 300deg 301.5deg,
      #74C0FC 301.5deg 358.5deg, var(--surface) 358.5deg 360deg
    );
  }
  .mini-wheel::after {
    content: "";
    position: absolute;
    inset: 31%;
    border-radius: 50%;
    background: var(--surface);
  }
  .mini-pointer {
    position: absolute;
    top: -9%;
    left: 50%;
    width: 13%;
    transform: translateX(-50%);
  }
  .mini-pointer svg { display: block; width: 100%; height: auto; }

  /* POPメーカーのサムネイル */
  .thumb.pop {
    background: #FFE500;
    box-shadow: inset 0 0 0 10px #FFE500, inset 0 0 0 16px #111111;
  }
  .pop-text {
    font-family: "Dela Gothic One", "Zen Kaku Gothic New", sans-serif;
    font-size: clamp(40px, 13vw, 64px);
    line-height: 1;
    color: #E8001C;
    transform: rotate(-4deg);
    paint-order: stroke fill;
    -webkit-text-stroke: 14px #111111;
    position: relative;
  }
  .pop-text span {
    position: absolute;
    inset: 0;
    paint-order: stroke fill;
    -webkit-text-stroke: 7px #FFFFFF;
    color: #E8001C;
  }

  .app-name {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 0 6px;
  }
  .app-name h2 { margin: 0; font-size: 21px; font-weight: 900; }
  .level {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: var(--field);
    border-radius: 999px;
    padding: 4px 10px;
  }
  .app p { margin: 6px 6px 0; color: var(--sub); font-size: 15px; }

  footer { margin-top: 32px; color: var(--sub); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>デモアプリ集</h1>
    <p class="lead">Claude Codeに文章で頼んで作ったWebアプリです。スマホでもPCでも、そのまま使えます。</p>
  </header>

  <main class="apps">
    <a class="app" href="roulette/">
      <div class="thumb roulette" aria-hidden="true">
        <div class="mini-wheel">
          <div class="mini-pointer"><svg viewBox="0 0 28 34"><path d="M14 34 L2 12 A13 13 0 1 1 26 12 Z" fill="currentColor"/><circle cx="14" cy="12" r="5" fill="var(--field)"/></svg></div>
        </div>
      </div>
      <div class="app-name">
        <h2>ルーレット</h2>
        <span class="level">レベル1</span>
      </div>
      <p>項目を入れて回すだけ。順番決めや、今日のお題決めに。</p>
    </a>

    <a class="app" href="pop/">
      <div class="thumb pop" aria-hidden="true">
        <div class="pop-text">大特価<span>大特価</span></div>
      </div>
      <div class="app-name">
        <h2>POPメーカー</h2>
        <span class="level">レベル1</span>
      </div>
      <p>タイトルと副題を入れると、店頭POP風の文字に。画像で保存できます。</p>
    </a>
  </main>

  <footer>どのアプリも、入力した内容はどこにも送信されません</footer>
</div>
</body>
</html>
