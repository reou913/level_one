<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
<title>POPメーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Mochiy+Pop+One&family=Reggae+One&family=Yusei+Magic&family=Hachi+Maru+Pop&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F3F9;
    --surface: #FFFFFF;
    --field: #F1F3F9;
    --ink: #1A1C24;
    --sub: #6B7080;
    --line: #E3E6EF;
    --accent: #4C6EF5;
    --accent-press: #3B5BDB;
    --on-accent: #FFFFFF;
    --r-lg: 24px;
    --r-md: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121418;
      --surface: #1C1F26;
      --field: #262A33;
      --ink: #F1F3F9;
      --sub: #9AA0B0;
      --line: #2A2E38;
      --accent: #748FFC;
      --accent-press: #5C7CFA;
      --on-accent: #0E1430;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Meiryo", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 20px calc(32px + env(safe-area-inset-bottom));
  }
  header { margin-bottom: 20px; }
  h1 { margin: 0; font-size: 28px; font-weight: 900; line-height: 1.2; letter-spacing: -.01em; }
  .lead { margin: 6px 0 0; color: var(--sub); font-size: 14px; }

  .layout { display: grid; gap: 16px; }
  @media (min-width: 820px) {
    .layout { grid-template-columns: 1.4fr 1fr; align-items: start; }
    .preview { position: sticky; top: 20px; }
  }

  /* プレビュー */
  .preview {
    background: var(--surface);
    border-radius: 32px;
    padding: 16px;
  }
  canvas#pop {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
  }
  .preview-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
  }

  /* 設定パネル */
  .panel {
    background: var(--surface);
    border-radius: var(--r-lg);
    padding: 20px;
  }
  .panel + .panel { margin-top: 16px; }
  .field { display: block; margin-bottom: 18px; }
  .field:last-child { margin-bottom: 0; }
  .label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 8px;
  }
  .hint { color: var(--sub); font-size: 13px; font-weight: 500; }
  input[type="text"], textarea {
    width: 100%;
    font-size: 17px;
    padding: 13px 16px;
    border: 2px solid transparent;
    border-radius: var(--r-md);
    background: var(--field);
    outline: none;
    display: block;
  }
  textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
  input[type="text"]:focus, textarea:focus { border-color: var(--accent); }
  input::placeholder, textarea::placeholder { color: var(--sub); }

  .btn {
    border: none;
    border-radius: var(--r-md);
    font-weight: 700;
    padding: 13px 16px;
    transition: background-color .12s, transform .08s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-primary:active { background: var(--accent-press); }
  .btn-soft { background: var(--field); color: var(--ink); }

  /* 配色 */
  .swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .swatch {
    border: 2px solid transparent;
    background: var(--field);
    border-radius: var(--r-md);
    padding: 10px 8px 8px;
    display: grid;
    gap: 6px;
    justify-items: center;
    font-size: 13px;
    font-weight: 700;
  }
  .swatch[aria-pressed="true"] { border-color: var(--accent); }
  .chip-colors { display: flex; height: 22px; width: 100%; border-radius: 8px; overflow: hidden; }
  .chip-colors span { flex: 1; }
  .cycle { width: 100%; margin-top: 8px; }

  /* フォント */
  .fonts { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .font-btn {
    border: 2px solid transparent;
    background: var(--field);
    border-radius: var(--r-md);
    padding: 10px 12px;
    text-align: left;
  }
  .font-btn[aria-pressed="true"] { border-color: var(--accent); }
  .font-sample { display: block; font-size: 22px; line-height: 1.3; }
  .font-name { display: block; font-size: 12px; color: var(--sub); margin-top: 2px; }

  footer { text-align: center; color: var(--sub); font-size: 12px; margin-top: 24px; }
  .back {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--sub);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 12px;
    padding: 4px 0;
  }
  .back svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>アプリ一覧</a>
  <header>
    <h1>POPメーカー</h1>
    <p class="lead">タイトルと副題を入れると、店頭POP風の文字になります</p>
  </header>

  <div class="layout">
    <div class="preview">
      <canvas id="pop" width="1200" height="900" role="img" aria-label="POPのプレビュー"></canvas>
      <div class="preview-actions">
        <button class="btn btn-soft" type="button" id="shuffleBtn">ゆれを変える</button>
        <button class="btn btn-primary" type="button" id="saveBtn">画像で保存</button>
      </div>
    </div>

    <div>
      <section class="panel" aria-label="文字">
        <label class="field">
          <span class="label">タイトル <span class="hint">改行で2行にできます</span></span>
          <textarea id="titleInput" rows="2" maxlength="30">大特価！</textarea>
        </label>
        <label class="field">
          <span class="label">副題</span>
          <input type="text" id="subInput" maxlength="40" value="本日かぎりのお買い得">
        </label>
      </section>

      <section class="panel" aria-labelledby="colorTitle">
        <div class="label" id="colorTitle">配色</div>
        <div class="swatches" id="swatches"></div>
        <button class="btn btn-soft cycle" type="button" id="cycleBtn">配色を切り替える</button>
      </section>

      <section class="panel" aria-labelledby="fontTitle">
        <div class="label" id="fontTitle">フォント</div>
        <div class="fonts" id="fonts"></div>
      </section>
    </div>
  </div>

  <footer>入力した文字はどこにも送信されません</footer>
</div>

<script>
(() => {
  // ===== 配色パターン =====
  // bg：背景 / frame：枠 / title：タイトル文字 / inner：内側のふち / outer：外側のふち / sub：副題の文字 / subLine：副題のふち
  const PALETTES = [
    { name: "イエロー", bg: "#FFE500", frame: "#111111", title: "#E8001C", inner: "#FFFFFF", outer: "#111111", sub: "#111111", subLine: "#FFFFFF" },
    { name: "ブラック", bg: "#141414", frame: "#FFE500", title: "#FFE500", inner: "#E8001C", outer: "#FFFFFF", sub: "#FFFFFF", subLine: "#141414" },
    { name: "ブルー",   bg: "#1D4ED8", frame: "#FFE500", title: "#FFFFFF", inner: "#E8001C", outer: "#FFE500", sub: "#FFE500", subLine: "#0B2A8A" }
  ];

  // ===== フォント（Googleフォントの無料フォント） =====
  const FONTS = [
    { name: "どっしり", family: "Dela Gothic One" },
    { name: "まるポップ", family: "Mochiy Pop One" },
    { name: "筆っぽい", family: "Reggae One" },
    { name: "手書きマジック", family: "Yusei Magic" },
    { name: "丸文字", family: "Hachi Maru Pop" }
  ];

  const W = 1200, H = 900;
  const canvas = document.getElementById("pop");
  const ctx = canvas.getContext("2d");
  const $ = id => document.getElementById(id);

  let paletteIndex = 0;
  let fontIndex = 0;
  let seed = 7;

  // ===== 毎回同じゆれ方にするための乱数 =====
  function makeRandom(s) {
    return () => {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      let t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // ===== タイトルを行に分ける =====
  function splitTitle(text) {
    let lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean).slice(0, 3);
    if (!lines.length) lines = ["タイトル"];
    // 1行が長すぎるときは自動で2行に分ける
    if (lines.length === 1 && [...lines[0]].length > 7) {
      const chars = [...lines[0]];
      const half = Math.ceil(chars.length / 2);
      lines = [chars.slice(0, half).join(""), chars.slice(half).join("")];
    }
    return lines;
  }

  // ===== 1文字ずつ位置を決める =====
  function layoutLine(line, size, family, rand) {
    ctx.font = `${size}px "${family}"`;
    const glyphs = [...line].map(ch => {
      const w = ctx.measureText(ch).width;
      return {
        ch,
        w,
        rot: (rand() - 0.5) * 0.14,          // 少し傾ける
        sy: 0.94 + rand() * 0.14,            // 少し縦にのばす
        dy: (rand() - 0.5) * size * 0.08     // 少し上下にずらす
      };
    });
    const tracking = -size * 0.03;            // 字間を少しつめる
    const width = glyphs.reduce((a, g) => a + g.w + tracking, -tracking);
    return { glyphs, width, tracking };
  }

  // ===== ふち取り文字を描く（外側 → 内側 → 文字の順に重ねる） =====
  function drawGlyphLines(lines, size, family, cx, startY, lineGap, colors, outerW, innerW) {
    const passes = [
      { stroke: colors.outer, width: outerW },
      { stroke: colors.inner, width: innerW },
      { fill: colors.title }
    ];
    passes.forEach(pass => {
      lines.forEach((ln, li) => {
        let x = cx - ln.width / 2;
        const y = startY + li * lineGap;
        ln.glyphs.forEach(g => {
          ctx.save();
          ctx.translate(x + g.w / 2, y + g.dy);
          ctx.rotate(g.rot);
          ctx.scale(1, g.sy);
          ctx.font = `${size}px "${family}"`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineJoin = "round";
          ctx.miterLimit = 2;
          if (pass.stroke) {
            ctx.strokeStyle = pass.stroke;
            ctx.lineWidth = pass.width;
            ctx.strokeText(g.ch, 0, 0);
          } else {
            ctx.fillStyle = pass.fill;
            ctx.fillText(g.ch, 0, 0);
          }
          ctx.restore();
          x += g.w + ln.tracking;
        });
      });
    });
  }

  // ===== POP全体を描く =====
  function draw() {
    const p = PALETTES[paletteIndex];
    const family = FONTS[fontIndex].family;
    const title = $("titleInput").value;
    const sub = $("subInput").value.trim();

    // 背景と枠
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = p.bg;
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = p.frame;
    ctx.lineWidth = 16;
    ctx.strokeRect(28, 28, W - 56, H - 56);

    // タイトル：入る大きさを計算
    const rand = makeRandom(seed);
    const lines = splitTitle(title);
    const areaW = W - 160;
    const areaTop = 90, areaBottom = sub ? 640 : 790;
    const areaH = areaBottom - areaTop;
    const lineRatio = 1.12;

    ctx.font = `100px "${family}"`;
    const widest = Math.max(...lines.map(l => [...l].reduce((a, ch) => a + ctx.measureText(ch).width * 0.97, 0)));
    let size = Math.min(
      areaW / (widest / 100),
      areaH / (lines.length * lineRatio),
      340
    );
    // ふちの分だけ少し小さく
    size *= 0.9;

    const laid = lines.map(l => layoutLine(l, size, family, rand));
    const lineGap = size * lineRatio;
    const blockH = lineGap * (lines.length - 1);
    const startY = areaTop + areaH / 2 - blockH / 2;

    // 全体を少し右上がりに
    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.rotate(-0.035);
    ctx.translate(-W / 2, -H / 2);
    drawGlyphLines(laid, size, family, W / 2, startY, lineGap, p, size * 0.30, size * 0.16);
    ctx.restore();

    // 副題
    if (sub) {
      let subSize = 76;
      ctx.font = `${subSize}px "${family}"`;
      const sw = ctx.measureText(sub).width;
      if (sw > areaW) subSize = subSize * areaW / sw;
      ctx.font = `${subSize}px "${family}"`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.strokeStyle = p.subLine;
      ctx.lineWidth = subSize * 0.22;
      ctx.strokeText(sub, W / 2, 735);
      ctx.fillStyle = p.sub;
      ctx.fillText(sub, W / 2, 735);
    }
  }

  // フォントを読み込んでから描く
  function redraw() {
    const family = FONTS[fontIndex].family;
    const text = $("titleInput").value + $("subInput").value;
    if (document.fonts && document.fonts.load) {
      document.fonts.load(`80px "${family}"`, text || "あ").then(draw, draw);
    }
    draw();
  }

  // ===== 配色ボタン =====
  function buildSwatches() {
    const box = $("swatches");
    PALETTES.forEach((p, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "swatch";
      b.setAttribute("aria-pressed", String(i === paletteIndex));
      b.innerHTML = `<span class="chip-colors"><span style="background:${p.bg}"></span><span style="background:${p.title}"></span><span style="background:${p.outer}"></span></span>`;
      b.append(p.name);
      b.addEventListener("click", () => setPalette(i));
      box.appendChild(b);
    });
  }
  function setPalette(i) {
    paletteIndex = i;
    document.querySelectorAll(".swatch").forEach((b, j) => b.setAttribute("aria-pressed", String(j === i)));
    draw();
  }

  // ===== フォントボタン =====
  function buildFonts() {
    const box = $("fonts");
    FONTS.forEach((f, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "font-btn";
      b.setAttribute("aria-pressed", String(i === fontIndex));
      const s = document.createElement("span");
      s.className = "font-sample";
      s.style.fontFamily = `"${f.family}", sans-serif`;
      s.textContent = "大特価";
      const n = document.createElement("span");
      n.className = "font-name";
      n.textContent = f.name;
      b.append(s, n);
      b.addEventListener("click", () => {
        fontIndex = i;
        document.querySelectorAll(".font-btn").forEach((x, j) => x.setAttribute("aria-pressed", String(j === i)));
        redraw();
      });
      box.appendChild(b);
    });
  }

  // ===== 操作 =====
  $("titleInput").addEventListener("input", redraw);
  $("subInput").addEventListener("input", redraw);
  $("cycleBtn").addEventListener("click", () => setPalette((paletteIndex + 1) % PALETTES.length));
  $("shuffleBtn").addEventListener("click", () => { seed = Math.floor(Math.random() * 1e9); draw(); });
  $("saveBtn").addEventListener("click", () => {
    const name = ([...$("titleInput").value.replace(/\s/g, "")].slice(0, 10).join("") || "pop") + ".png";
    canvas.toBlob(blob => {
      if (!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }, "image/png");
  });

  // ===== 起動 =====
  buildSwatches();
  buildFonts();
  redraw();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
